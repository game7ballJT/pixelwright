[package]
name = "pixelwright-cli"
description = "Headless Pixelwright: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Open HEIC/HEIF photos (the optional pixelwright-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["pixelwright-codecs/heif"]

[lints]
workspace = true

[lib]
name = "pixelwright_cli"
path = "src/lib.rs"

[[bin]]
name = "pixelwright-cli"
path = "src/main.rs"

[dependencies]
pixelwright-automation = { path = "../../crates/automation" }
pixelwright-engine = { workspace = true }
pixelwright-io = { workspace = true }
pixelwright-format = { path = "../../crates/format" }
pixelwright-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

