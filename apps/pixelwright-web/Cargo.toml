[package]
name = "pixelwright-web"
description = "Pixelwright in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Open HEIC/HEIF photos (the optional pixelwright-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["pixelwright-codecs/heif"]

[lints]
workspace = true

[[bin]]
name = "pixelwright-web"
path = "src/main.rs"

[dependencies]
pixelwright-engine = { workspace = true }
pixelwright-io = { workspace = true }
pixelwright-codecs = { workspace = true }
pixelwright-doc = { workspace = true }
pixelwright-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "Storage", "Event", "EventTarget", "MouseEvent", "PointerEvent"] }
