[package]
name = "pixelwright-io"
description = "Import/export between pixelwright documents and PSD/PSB and flat raster formats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
# HEIC/HEIF decode (forwarded to pixelwright-codecs; see its `heif` feature).
heif = ["pixelwright-codecs/heif"]

[dependencies]
pixelwright-geom = { workspace = true }
pixelwright-color = { workspace = true }
pixelwright-cms = { workspace = true }
pixelwright-raster = { workspace = true }
pixelwright-doc = { workspace = true }
pixelwright-compose = { workspace = true }
pixelwright-algo = { workspace = true }
pixelwright-psd = { workspace = true }
pixelwright-codecs = { workspace = true }
pixelwright-raw = { workspace = true }
pixelwright-text = { workspace = true }
pixelwright-paint = { workspace = true }
pixelwright-vector = { workspace = true }
pixelwright-format = { path = "../format" }
thiserror = { workspace = true }
serde_json = { workspace = true }
blake3 = { version = "1.8", default-features = false, features = ["pure"] }

[dev-dependencies]
pixelwright-psd = { workspace = true, features = ["testgen"] }
pixelwright-raw = { workspace = true, features = ["testgen"] }
proptest = { workspace = true }
