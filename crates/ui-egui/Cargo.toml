[package]
name = "pixelwright-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pixelwright-geom = { workspace = true }
pixelwright-color = { workspace = true }
pixelwright-cms = { workspace = true }
pixelwright-raster = { workspace = true }
pixelwright-doc = { workspace = true }
pixelwright-compose = { workspace = true }
pixelwright-gpu = { workspace = true }
pixelwright-engine = { workspace = true }
pixelwright-io = { workspace = true }
pixelwright-plugins = { workspace = true }
pixelwright-algo = { workspace = true }
pixelwright-text = { workspace = true }
pixelwright-vector = { workspace = true }
# Reading files to open them (bounded reads, a clear error for files larger than memory).
pixelwright-format = { workspace = true }
# Decoding the brand mark's PNG (`brand.rs`); already linked through pixelwright-io.
pixelwright-codecs = { workspace = true }
egui = { workspace = true }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
# Safe native UI-language APIs (Windows/macOS); no subprocess or web dependency.
sys-locale = "=0.3.2"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }
# Benchmark helpers for the `--json` benches `cargo xtask perf` runs (in-process RSS, percentiles).
pixelwright-testkit = { workspace = true }
# Only for examples/perf_scenarios.rs (a 500-brush .abr for the #210 import row).
pixelwright-psd = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
